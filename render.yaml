# render.yaml — Blueprint de Render (Infra as Code).
# Colocar en la RAIZ del repositorio.
# La base de datos NO se define aqui: vive en Neon (gratis y persistente).
# En el dashboard: New > Blueprint > selecciona el repo. Render lee este archivo.
#
# Nota: si tu cuenta muestra error con 'runtime: docker', cambialo por 'env: docker'
# (Render renombro la clave; ambas existen segun la antiguedad de la cuenta).

services:
  - type: web
    name: inventory-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon            # cambia a la region mas cercana si lo prefieres
    healthCheckPath: /actuator/health
    autoDeploy: true          # redeploy automatico al hacer push
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0
      # --- Base de datos (Neon) -> se cargan a mano en el dashboard ---
      - key: DB_URL
        sync: false           # jdbc:postgresql://ep-xxx.neon.tech/inventory?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # --- JWT: Render genera un valor aleatorio seguro automaticamente ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      # --- CORS: la URL del frontend en Cloudflare Pages ---
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # ej: https://tu-app.pages.dev
      # --- SMTP (solo si vas a probar el envio del PDF por correo) ---
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: no-reply@litethinking.com