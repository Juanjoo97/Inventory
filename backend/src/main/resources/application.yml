spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Parametros propios de la aplicacion
app:
  jwt:
    # Clave HS256: minimo 32 bytes. Sobreescribir en produccion via variable de entorno JWT_SECRET.
    secret: ${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-bytes-para-hs256-2024}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9000,http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@litethinking.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  level:
    org.springframework.security: INFO